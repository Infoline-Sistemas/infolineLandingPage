<!doctype html>
<!--
  Fonte da imagem de compartilhamento (og:image) do site: 1200x630.
  Para gerar novamente assets/img/og-infoline.png:
  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --disable-gpu --hide-scrollbars
    --window-size=1200,630 --screenshot=assets/img/og-infoline.png tools/social/og-default.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;color:#fff;
    background:
      radial-gradient(circle at 88% 8%,rgba(75,221,255,.28),transparent 38%),
      radial-gradient(circle at 6% 100%,rgba(27,108,205,.35),transparent 42%),
      linear-gradient(135deg,#071c43 0%,#0a367a 58%,#1358ac 100%);
    padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:20px}
  .brand img{width:76px;height:76px}
  .brand b{display:block;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand span{display:block;margin-top:6px;font-size:16px;font-weight:600;letter-spacing:.16em;color:#9fdcff}
  h1{font-size:64px;line-height:1.06;font-weight:800;letter-spacing:-.03em;max-width:15ch}
  h1 em{font-style:normal;color:#5fe0ff}
  p{margin-top:22px;font-size:26px;line-height:1.4;color:#c9dbf5;max-width:42ch}
  .tags{display:flex;gap:14px}
  .tags span{padding:10px 20px;border:1px solid rgba(139,217,242,.35);border-radius:999px;
    background:rgba(255,255,255,.07);font-size:20px;font-weight:600;color:#e3f2ff}
</style>
</head>
<body>
  <div class="brand">
    <img src="../../assets/img/logo-mark.svg" alt="">
    <div><b>Infoline</b><span>GESTÃO EMPRESARIAL</span></div>
  </div>
  <div>
    <h1>Um ERP para conectar <em>toda a sua operação.</em></h1>
    <p>Produção, estoque, compras, vendas, financeiro, fiscal e pessoas em uma plataforma web.</p>
  </div>
  <div class="tags"><span>Desde 2001</span><span>ERP online</span><span>Atendimento em todo o Brasil</span></div>
</body>
</html>
